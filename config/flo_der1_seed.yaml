dataset:
    dataset_name: FLO
    GZSL: True
    data_path: ../../Datasets/FLO
    save_path: ../../gzsl_svae_test/experiments/FLO_der
    seen_classes: 82
    unseen_classes: 10
    
    use_orginal_attr: False
    attr_path: ../Stage2_data/ #FLO_attr.pth
    attrs_type: "unseen"
    num_attr: 10
    
    syn_data_root: ../Stage2_data/
    #syn_data: FLO_unseen_data.pth
        
    
    use_der: True
    der_weight: 0.1
    der_batch: 512

    
    write_path: ../results_csv/FLO_seed
    test_file_name: flo_synthetic_der1
    
model:
    ifsample: False
    attr_size: 1024
    input_size: 2048
    mid_size: 512
    hidden_size: 64
    classes: 10

train:
    learning_rate: 1e-3
    batch_size: 512 #128
    check_point: 0
    epoch: 200
    interval: 100
    save_every: 10
    
